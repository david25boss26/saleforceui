version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: etl-postgres
    environment:
      POSTGRES_DB: salesforce_etl
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d salesforce_etl" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: etl-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/salesforce_etl
      - MOCK_SALESFORCE=true
      - SCHEDULER_ENABLED=true
      - APP_ENV=docker
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./sample_data:/app/sample_data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: etl-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
